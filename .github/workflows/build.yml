name: Build and verify Tweakly
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable EXE
        run: dotnet publish Tweakly.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Test transaction behavior without touching Windows settings
        shell: pwsh
        run: |
          $p = Start-Process .\publish\Tweakly.exe -ArgumentList '--self-test', 'test-report.json' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { Get-Content test-report.json; throw 'Tweakly self-tests failed' }
          $artifacts = @(Get-ChildItem publish -File)
          if ($artifacts.Count -ne 1 -or $artifacts[0].Name -ne 'Tweakly.exe') { throw 'Publish must contain exactly one EXE' }
      - uses: actions/upload-artifact@v4
        with:
          name: Tweakly-tests
          path: test-report.json
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Tweakly-win-x64
          path: publish/Tweakly.exe
